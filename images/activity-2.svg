44">User</text><text x="150.0" y="349" text-anchor="middle" font-size="10" fill="#5F6368">Google Account</text><rect x="410" y="275" width="180" height="86" rx="8" fill="#E8F0FE" stroke="#AECBFA" stroke-width="1.5"/><g transform="translate(500.0,299)"><rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#4A7BD4" stroke-width="2"/><rect x="-3" y="-3" width="6" height="6" fill="#4A7BD4"/></g><text x="500.0" y="331" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A44">Compute Engine</text><text x="500.0" y="349" text-anchor="middle" font-size="10" fill="#5F6368">runs as vm-sa</text><rect x="760" y="275" width="180" height="86" rx="8" fill="#E8F0FE" stroke="#AECBFA" stroke-width="1.5"/><g transform="translate(850.0,299)"><circle cx="-1" cy="-1" r="7" fill="none" stroke="#4A7BD4" stroke-width="2"/><line x1="4" y1="4" x2="9" y2="9" stroke="#4A7BD4" stroke-width="2.5"/></g><text x="850.0" y="331" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A44">BigQuery</text><text x="850.0" y="349" text-anchor="middle" font-size="10" fill="#5F6368">dataset lab_data</text><line x1="248" y1="318" x2="402" y2="318" stroke="#1A73E8" stroke-width="2" marker-end="url(#b)"/><rect x="250" y="284" width="150" height="22" rx="11" fill="#E8F0FE"/><text x="325.0" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A73E8">roles/compute.viewer</text><text x="325.0" y="336" text-anchor="middle" font-size="10" fill="#5F6368">user can see the VM</text><line x1="598" y1="318" x2="752" y2="318" stroke="#188038" stroke-width="2" marker-end="url(#g)"/><rect x="600" y="284" width="150" height="22" rx="11" fill="#E6F4EA"/><text x="675.0" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#188038">roles/bigquery.dataViewer</text><text x="675.0" y="336" text-anchor="middle" font-size="10" fill="#5F6368">service account reads tables</text></svg>