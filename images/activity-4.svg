FA" stroke-width="1.5"/><g transform="translate(607.5,129)"><path d="M0 -10 L9 -6 L9 1 C9 6 5 9 0 11 C-5 9 -9 6 -9 1 L-9 -6 z" fill="#4A7BD4"/><circle cx="0" cy="0" r="3" fill="#fff"/></g><text x="607.5" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A44">DLP</text><text x="607.5" y="179" text-anchor="middle" font-size="10" fill="#5F6368">Sensitive Data Prot.</text><rect x="795" y="105" width="125" height="86" rx="8" fill="#E8F0FE" stroke="#AECBFA" stroke-width="1.5"/><g transform="translate(857.5,129)"><rect x="-8" y="-9" width="16" height="18" rx="2" fill="none" stroke="#4A7BD4" stroke-width="2"/><line x1="-4" y1="-4" x2="4" y2="-4" stroke="#4A7BD4" stroke-width="2"/><line x1="-4" y1="0" x2="4" y2="0" stroke="#4A7BD4" stroke-width="2"/><line x1="-4" y1="4" x2="4" y2="4" stroke="#4A7BD4" stroke-width="2"/></g><text x="857.5" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A44">Cloud Logging</text><text x="857.5" y="179" text-anchor="middle" font-size="10" fill="#5F6368">findings &amp; logs</text><line x1="175" y1="148" x2="290" y2="148" stroke="#1A73E8" stroke-width="2" marker-end="url(#b)"/><rect x="177" y="114" width="111" height="22" rx="11" fill="#E8F0FE"/><text x="232.5" y="129" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A73E8">storage.objectCreator</text><text x="232.5" y="166" text-anchor="middle" font-size="10" fill="#5F6368">app uploads files</text><line x1="425" y1="148" x2="540" y2="148" stroke="#188038" stroke-width="2" marker-end="url(#g)"/><rect x="427" y="114" width="111" height="22" rx="11" fill="#E6F4EA"/><text x="482.5" y="129" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#188038">roles/dlp.user</text><text x="482.5" y="166" text-anchor="middle" font-size="10" fill="#5F6368">you run a scan</text><line x1="675" y1="148" x2="790" y2="148" stroke="#1A73E8" stroke-width="2" marker-end="url(#b)"/><rect x="677" y="114" width="111" height="22" rx="11" fill="#E8F0FE"/